schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Project: Rocket BlackBox (Avionics & Flight Data Recorder)
  MCU: RAK3112 (Espressif ESP32-S3 + Semtech SX1262 LoRa, 16MB Flash, 8MB PSRAM)

  Subsystems & Directory Organization:
    - firmware/: Embedded PlatformIO project using the Arduino-ESP32 framework.
      - Source Code: firmware/src/
      - Headers: firmware/include/
      - Build Config: firmware/platformio.ini
      - Partitions: firmware/partitions_12MB_ffat.csv (12MB FFat partition for flight data)
      - Diagnostic Reports: firmware/HARDWARE_DIAGNOSTICS.md, firmware/pinout.md, firmware/README.md
      - Note: All firmware build, flash, and test tasks must run with working directory in firmware/.
    - pcb/: Hardware schematics, layout documentation, and board photos/renders.
      - Schematic: pcb/Payload_Schematic.pdf
      - Visuals: pcb/.images/
    - mechanical/: 3D CAD models (STEP format) for board outlines and mounting geometries.
      - Main Board: mechanical/3D_MAIN_BOARD_2026-09-24.step
      - GPS Board: mechanical/3D_GPS_BOARD_2026-09-24.step
    - website/: Presentation website, hardware reference docs, and telemetry dashboard.
      - Entry: website/index.html
      - Assets: website/assets/
    - openspec/: OpenSpec specifications, active changes, and archives.

rules:
  proposal:
    - Explicitly state which subsystem (firmware, pcb, mechanical, website) is affected.
    - Always reference full paths relative to repository root (e.g. firmware/src/... instead of src/...).
  tasks:
    - Explicitly specify the working directory for execution steps (e.g. "Run PlatformIO build in firmware/").
