[platformio]
default_envs = rocket_payload_diagnostic

[env:rocket_payload_diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_12MB_ffat.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

lib_deps = 
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit LTR390 Library @ ^1.1.2
    adafruit/Adafruit TSL2591 Library @ ^1.4.5
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    sensirion/Sensirion I2C SGP41 @ ^1.0.0
    sensirion/Sensirion Gas Index Algorithm @ ^3.2.2
    robtillaart/MS5611 @ ^0.4.2
    mikalhart/TinyGPSPlus @ ^1.0.3
    jgromes/RadioLib @ ^6.6.0
